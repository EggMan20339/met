<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Glimmerdeep art sheet</title>
<style>body{background:#14121f;color:#cfc6f0;font:12px Georgia,serif;margin:0;padding:16px}h2{font-weight:normal;color:#ffd9a0;margin:18px 0 6px}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}.cell{background:#1e1b2e;border:1px solid #2e2a44;padding:6px;text-align:center}.cell div{margin-top:4px;color:#8a82b0;font-size:10px}.bg{display:block;width:512px;height:320px;background:#0d0c1a}</style></head>
<body><script src="../src/artdata.js"></script>
<script>
const groups = { 'Mote': /^mote_/, 'Creatures': /^(dimling|hushmoth|sporeling|rootram|snuffer|emberback|gloamwing|springfoot|husk)_/, 'Bosses': /^(gulletroot|bell|lightless)_/, 'Friends': /^(wick|bramble|tallow|ringer)/, 'Pickups & props': /^(petal|heartwood|gift_|heart$|hearth|lamp|waystone|crystal|puffcap|gate|house)/, 'Interface': /^(icon_|logo)/, 'Backgrounds': /^bg_/ };
const scale = new URLSearchParams(location.search).get('scale') || 3;
for (const [title, re] of Object.entries(groups)) {
  const h = document.createElement('h2'); h.textContent = title; document.body.appendChild(h); const row = document.createElement('div'); row.className = 'row'; document.body.appendChild(row);
  for (const name of Object.keys(ART_SVGS)) { if (!re.test(name)) continue; const m = ART_META[name]; const cell = document.createElement('div'); cell.className = 'cell'; const img = new Image(); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(ART_SVGS[name]); if (name.startsWith('bg_')) { img.className = 'bg'; } else { img.width = m.w * scale; img.height = m.h * scale; } cell.appendChild(img); const l = document.createElement('div'); l.textContent = name; cell.appendChild(l); row.appendChild(cell); }
}
</script></body></html>
